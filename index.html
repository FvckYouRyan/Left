<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distance Between Me and Tomorrow</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#04050a;
overflow:hidden;
font-family:Georgia, serif;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

#flash{
position:fixed;
inset:0;
background:white;
opacity:0;
pointer-events:none;
z-index:1;
}

.clock{
position:fixed;
top:20px;
right:20px;
font-size:18px;
letter-spacing:2px;
opacity:.8;
z-index:5;
}

.content{
position:relative;
z-index:3;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.box{
max-width:800px;
text-align:center;
}

h1{
font-size:48px;
margin-bottom:25px;
font-weight:300;
}

#text{
font-size:20px;
line-height:1.9;
white-space:pre-line;
min-height:300px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:14px 30px;
border:1px solid rgba(255,255,255,.3);
text-decoration:none;
color:white;
border-radius:50px;
transition:.4s;
backdrop-filter:blur(10px);
}

.btn:hover{
background:rgba(255,255,255,.15);
}
</style>
</head>

<body>

<div id="flash"></div>
<canvas id="rain"></canvas>

<div class="clock" id="clock"></div>

<div class="content">
<div class="box">

<h1>The Distance Between Me and Tomorrow</h1>

<div id="text"></div>

<a class="btn"
href="https://open.spotify.com/"
target="_blank">
🎵 Play Multo
</a>

</div>
</div>

<script>

const message = `Sometimes I feel like life never stopped.

Everyone kept moving.
Everyone kept growing.

They found their place.

And somehow...

I remained here.

Not because I wanted to stay.

But because every step forward
felt heavier than the last.

Some nights I stare at the ceiling
wondering if anyone notices
how hard I am trying.

I smile.
I laugh.
I answer messages.

But deep inside,
there is a version of me
quietly asking:

"When will it be my turn?"

Maybe tomorrow.

I still hope it will be tomorrow.`;

let i = 0;

function typeWriter(){
if(i < message.length){
document.getElementById("text").innerHTML += message.charAt(i);
i++;
setTimeout(typeWriter,40);
}
}

setTimeout(typeWriter,1000);

function updateClock(){
const now = new Date();
document.getElementById("clock").innerHTML =
now.toLocaleTimeString();
}

setInterval(updateClock,1000);
updateClock();

const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

let rain=[];

for(let i=0;i<250;i++){
rain.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
l:10+Math.random()*20,
s:4+Math.random()*8
});
}

function drawRain(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="rgba(180,180,255,.18)";
ctx.lineWidth=1;

rain.forEach(r=>{

ctx.beginPath();
ctx.moveTo(r.x,r.y);
ctx.lineTo(r.x,r.y+r.l);
ctx.stroke();

r.y+=r.s;

if(r.y>canvas.height){
r.y=-20;
r.x=Math.random()*canvas.width;
}

});

requestAnimationFrame(drawRain);
}

drawRain();

function lightning(){

const flash=document.getElementById("flash");

flash.style.transition="none";
flash.style.opacity="0.9";

setTimeout(()=>{
flash.style.transition=".6s";
flash.style.opacity="0";
},100);

let next=Math.random()*12000+5000;

setTimeout(lightning,next);
}

setTimeout(lightning,7000);

</script>

</body>
</html>
