<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distance Between Me and Tomorrow</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#05060a;
    color:#f2f2f2;
    font-family: Georgia, serif;
}
canvas{
    position:fixed;
    inset:0;
}
.content{
    position:relative;
    z-index:2;
    max-width:800px;
    margin:auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:40px;
}
h1{
    font-weight:300;
    letter-spacing:2px;
    opacity:0;
    animation:fadeIn 3s forwards;
}
#line{
    font-size:1.15rem;
    line-height:1.9;
    white-space:pre-line;
}
.cursor{
    display:inline-block;
    animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}
@keyframes fadeIn{to{opacity:1;}}
.footer{
    margin-top:40px;
    opacity:0.5;
    font-style:italic;
}
</style>
</head>
<body>
<canvas id="rain"></canvas>

<div class="content">
<h1>The Distance Between Me and Tomorrow</h1>
<div id="line"></div>
<div class="footer">A page for the nights that feel heavier than words.</div>
</div>

<script>
const text = `Sometimes I feel as though life continued moving
while I somehow remained still.

Not trapped.
Not broken.

Just... left behind.

People I once walked beside are now far ahead,
building futures, finding places to belong,
becoming someone.

And here I am,
counting quiet evenings,
wondering whether anyone notices the distance.

The hardest loneliness is not the absence of people.

It is the absence of being understood.

Every day I tell myself to keep going.
Every day I do.

But some nights,
when the world becomes silent,
I admit the truth:

I am tired of pretending that being strong
does not hurt.

If you found this page,
perhaps you know this feeling too.

And if you do,

I hope tomorrow finds us both.`;

let i=0;
function type(){
  if(i<text.length){
    document.getElementById("line").innerHTML =
      text.substring(0,i) + '<span class="cursor">|</span>';
    i++;
    setTimeout(type,35);
  }
}
setTimeout(type,1500);

const c=document.getElementById("rain");
const ctx=c.getContext("2d");
function resize(){
 c.width=window.innerWidth;
 c.height=window.innerHeight;
}
resize();
window.onresize=resize;

let drops=[];
for(let i=0;i<180;i++){
 drops.push({
   x:Math.random()*c.width,
   y:Math.random()*c.height,
   l:10+Math.random()*20,
   s:4+Math.random()*6
 });
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle="rgba(180,180,255,0.15)";
 ctx.lineWidth=1;
 drops.forEach(d=>{
   ctx.beginPath();
   ctx.moveTo(d.x,d.y);
   ctx.lineTo(d.x,d.y+d.l);
   ctx.stroke();
   d.y+=d.s;
   if(d.y>c.height){
      d.y=-20;
      d.x=Math.random()*c.width;
   }
 });
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
